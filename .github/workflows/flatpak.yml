name: Build and Release Flatpak

on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.11
      options: --privileged

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    # The in-app updater compares the release tag with __version__, so they must match.
    - name: Check version
      run: |
        version="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/olhclient/__init__.py)"
        tag="${GITHUB_REF_NAME#v}"
        if [ "${tag%-dev}" != "$version" ]; then
          echo "::error::Tag $GITHUB_REF_NAME does not match __version__ $version"
          exit 1
        fi

    # The release description is the metainfo <release> entry; fails when there is none.
    - name: Extract release notes from metainfo
      run: python3 .github/scripts/release_notes.py "${GITHUB_REF_NAME%-dev}" release-notes.md

    - name: Build Flatpak
      uses: flatpak/flatpak-github-actions/flatpak-builder@v6
      with:
        bundle: OpenLinkHub-Client-${{ github.ref_name }}.flatpak
        manifest-path: flatpak/io.github.mdmatthias.OpenLinkHub-Client.yaml
        cache-key: flatpak-builder-${{ github.sha }}

    - name: Release
      uses: softprops/action-gh-release@v3
      with:
        prerelease: ${{ endsWith(github.ref_name, '-dev') }}
        body_path: release-notes.md
        files: OpenLinkHub-Client-${{ github.ref_name }}.flatpak
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
