[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "olh-client"
version = "0.1.0"
description = "Desktop client for the OpenLinkHub API"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.8",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "respx>=0.21",
]

[project.scripts]
olh-client = "olhclient.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/olhclient"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
